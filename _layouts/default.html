<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="author" content="Quang Huy Nguyen">
  <meta name="theme-color" content="#f7f6f2">
  <meta property="og:title" content="{% if page.title == 'Home' %}Quang Huy Nguyen | Economist{% else %}{{ page.title }} | Quang Huy Nguyen{% endif %}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:type" content="website">
  <meta property="og:image" content="{{ '/assets/social-preview.svg' | relative_url }}">
  <title>{% if page.title == 'Home' %}Quang Huy Nguyen | Experimental, Environmental, and Agricultural Economist{% else %}{{ page.title }} | Quang Huy Nguyen{% endif %}</title>
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
  <script>
    const savedTheme = localStorage.getItem('theme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
      document.documentElement.dataset.theme = 'dark';
    }
  </script>
  {% if page.title == 'Home' %}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Quang Huy Nguyen",
    "alternateName": ["Huy Nguyen", "Huy Nguyen-Quang"],
    "jobTitle": "Economist",
    "email": "mailto:nguyenquanghuyib@gmail.com",
    "address": {
      "@type": "PostalAddress",
      "addressLocality": "Strasbourg",
      "addressCountry": "France"
    },
    "alumniOf": {
      "@type": "CollegeOrUniversity",
      "name": "University of Strasbourg"
    },
    "knowsAbout": [
      "Experimental economics",
      "Environmental economics",
      "Agricultural economics",
      "Information economics",
      "Econometrics",
      "Climate adaptation",
      "Sustainable food systems"
    ]
  }
  </script>
  {% endif %}
</head>
<body class="{{ page.body_class }}">
  <a class="skip-link" href="#main-content">Skip to main content</a>

  <header class="site-header">
    <div class="site-shell nav-wrap">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="Quang Huy Nguyen homepage">
        Quang Huy Nguyen
      </a>

      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="main-nav" aria-label="Open navigation">
        <span></span><span></span><span></span>
      </button>

      <nav id="main-nav" class="main-nav" aria-label="Main navigation">
        <a {% if page.nav == 'home' %}class="active"{% endif %} href="{{ '/' | relative_url }}">Home</a>
        <a {% if page.nav == 'research' %}class="active"{% endif %} href="{{ '/research/' | relative_url }}">Research</a>
        <a {% if page.nav == 'talks' %}class="active"{% endif %} href="{{ '/talks/' | relative_url }}">Talks</a>
        <a {% if page.nav == 'experience' %}class="active"{% endif %} href="{{ '/experience/' | relative_url }}">Experience</a>
        <a href="https://exper-otree-2e1bebd5d0b1.herokuapp.com/" target="_blank" rel="noopener">oTree programs ↗</a>
        <a {% if page.nav == 'contact' %}class="active"{% endif %} href="{{ '/contact/' | relative_url }}">Contact</a>
      </nav>

      <button class="theme-toggle" type="button" aria-label="Switch color theme" title="Switch color theme">◐</button>
    </div>
  </header>

  <main id="main-content">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="site-shell footer-wrap">
      <p>© <span id="year"></span> Quang Huy Nguyen</p>
      <p>Experimental, environmental, and agricultural economist</p>
    </div>
  </footer>

  <script src="{{ '/script.js' | relative_url }}"></script>
</body>
</html>
